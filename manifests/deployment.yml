                                                
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  namespace: work
  labels:
    app: &app nginx
    version: &versions 1.27.5
spec:
  replicas: 3
  selector:
    matchLabels:
      app: *app
      version: *versions
  template:
    metadata:
      labels:
        app: *app
        version: *versions
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10

#Базовый шаблон Deployment манифеста
# Здесь использованы якоря yaml для упрощение работы в image их использовать нельзя
