---

apiVersion: v1
kind: Pod
metadata:
  name: my-pod
  namespace: work
  labels:
    app: nginx
    version: 1.27.5
spec:
  containers:
    - name: nginx
      image: nginx:1.27.5
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      livenessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 15
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 15
        periodSeconds: 10




#Базовый манифест для создания Pod
#В иделае хороший манифест должен содержать  метки, явное указание tag контейнера, ресурсы, пробы, securityContext.
#Чтобы запустить данный манифест используем команду kubectl apply -f манифест